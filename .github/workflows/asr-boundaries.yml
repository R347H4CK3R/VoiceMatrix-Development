name: Generated speech ASR boundary investigation
'on':
  push:
    branches: [codex/rvc-conversion-controls]
    paths: [.github/workflows/asr-boundaries.yml, 'probes/asr-boundaries/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  asr-boundaries:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Human-local-pipeline-evidence
          run-id: 43684874866
          github-token: ${{ github.token }}
          path: captured
      - name: Prepare original and silence-margin copies
        run: python3 probes/asr-boundaries/prepare.py captured boundary-evidence
      - name: Stage pinned recognizer
        run: python3 tools/bundle_asr.py
      - name: Build production ASR with boundary diagnostic
        run: |
          brew install xcodegen
          mkdir -p VoiceMatrix/Resources/{Phonon,OpenVoice,F5TTS}
          cp probes/asr-boundaries/Probe.swift probes/native-asr/Diagnostic.swift
          python3 tools/create_diagnostic_collection.py
          xcodegen generate
          xcodebuild -project VoiceMatrix.xcodeproj -scheme BundledASRDiagnostic -configuration Release -derivedDataPath boundary-build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build > boundary-evidence/build.log 2>&1 || { tail -100 boundary-evidence/build.log; exit 1; }
      - name: Measure native recognition with network denied
        run: sandbox-exec -p '(version 1)(allow default)(deny network*)' boundary-build/Build/Products/Release/BundledASRDiagnostic VoiceMatrix/Resources/ParakeetASR boundary-evidence boundary-evidence/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ASR-boundary-evidence
          path: boundary-evidence
          retention-days: 14
