name: Verify build12 large IPA artifact without publishing
on:
  push:
    branches: [diagnostic/build12-package-preflight]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bffea881caea28cbfcd20e9cfbf8dd5da0075a8b
          persist-credentials: false
      - name: Download immutable package and verify contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/R347H4CK3R/VoiceMatrix-Development/actions/artifacts/14244724237/zip > package.zip
          echo '5ad57884854e6c582f086983fc1db36eda0655e5943346676ca0ee473abaa37b  package.zip' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('package');root.mkdir()
          with zipfile.ZipFile('package.zip') as z:
              names=z.namelist()
              expected={'VoiceMatrix-0.4.9-build12.ipa','character-inspection.json','character-ipa.sha256','source-proof.json','dependency-notices.json','assets.json','packaging-status.json','vendor-before.json','vendor-after.json'}
              assert set(names)==expected and len(names)==len(expected)
              assert z.testzip() is None
              z.extractall(root)
          ipa=root/'VoiceMatrix-0.4.9-build12.ipa'
          with ipa.open('rb') as f:sha=hashlib.file_digest(f,'sha256').hexdigest()
          assert (root/'character-ipa.sha256').read_text().split()[0]==sha
          proof=json.loads((root/'source-proof.json').read_text())
          status=json.loads((root/'packaging-status.json').read_text())
          assert status['sourceCommit']=='bffea881caea28cbfcd20e9cfbf8dd5da0075a8b'
          (root/'preflight.json').write_text(json.dumps(dict(sourceCommit=status['sourceCommit'],artifactID=14244724237,artifactSHA256='5ad57884854e6c582f086983fc1db36eda0655e5943346676ca0ee473abaa37b',ipaSHA256=sha,ipaBytes=ipa.stat().st_size),indent=2)+'\n')
          PY
          python3 tools/character_package.py inspect package/VoiceMatrix-0.4.9-build12.ipa --expected-version 0.4.9 --expected-build 12 --dependency-proof package/dependency-notices.json > package/independent-inspection.json
          python3 tools/bundle_diarization.py --inspect-ipa package/VoiceMatrix-0.4.9-build12.ipa
          python3 tools/bundle_asr.py --inspect-ipa package/VoiceMatrix-0.4.9-build12.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Build12-independent-package-inspection
          path: |
            package/*.json
            package/*.sha256
          if-no-files-found: error
          retention-days: 14
