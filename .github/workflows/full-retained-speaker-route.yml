name: Full retained speaker actual selection route
permissions:
  contents: read
  actions: read
jobs:
  actual-local-pipeline:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: character-cache
        key: character-assets-685e8816-716d2f41
    - name: Validate source and prepare pinned shared assets
      run: 'python3 -m unittest tests.test_real_reference_pool_diagnostic tests.test_local_pipeline_diagnostic
        tests.test_local_video_studio -v

        python3 tools/bundle_asr.py

        python3 tools/bundle_diarization.py

        python3 tools/character_package.py prepare --cache character-cache --resources
        character-resources > assets.json

        python3 - <<''PY''

        from pathlib import Path

        import shutil

        target=Path(''VoiceMatrix/Resources/F5TTS'')

        if target.is_symlink(): raise SystemExit(''Unexpected link'')

        if target.exists(): shutil.rmtree(target)

        shutil.copytree(''character-resources/F5TTS'',target)

        PY

        '
    - name: Recover complete pinned human source
      run: 'brew install ffmpeg

        python3 probes/full-retained-speaker-route/prepare.py local-evidence

        python3 tools/create_diagnostic_collection.py

        '
    - name: Build unchanged coordinator with diagnostic-only hash-pinned dependency
        patch
      env:
        USE_FROZEN: 'false'
      run: "test \"$(uname -m)\" = arm64\nbrew install xcodegen\nmkdir -p VoiceMatrix/Resources/{Phonon,OpenVoice,F5TTS}\n\
        xcodegen generate\ngraph=VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved\n\
        if [ \"$USE_FROZEN\" = true ]; then\n  mkdir -p \"$(dirname \"$graph\")\"\n\
        \  cp frozen/Package.resolved \"$graph\"\n  xcodebuild -resolvePackageDependencies\
        \ -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile\
        \ -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme LocalStudioDiagnostic\
        \ -derivedDataPath local-build > local-evidence/resolve.log 2>&1 || { tail\
        \ -120 local-evidence/resolve.log; exit 1; }\n  cmp frozen/Package.resolved\
        \ \"$graph\"\nelse\n  xcodebuild -resolvePackageDependencies -skipPackagePluginValidation\
        \ -project VoiceMatrix.xcodeproj -scheme LocalStudioDiagnostic -derivedDataPath\
        \ local-build > local-evidence/resolve.log 2>&1 || { tail -120 local-evidence/resolve.log;\
        \ exit 1; }\nfi\ncp \"$graph\" local-evidence/Package.resolved\npython3 probes/diarizer-eof/apply.py\
        \ local-build/SourcePackages/checkouts/FluidAudio local-evidence\ncp probes/diarizer-eof/fluid-eof.patch\
        \ probes/diarizer-eof/manifest.json probes/diarizer-eof/FluidAudio-LICENSE.txt\
        \ local-evidence/\nxcodebuild -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile\
        \ -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme LocalStudioDiagnostic\
        \ -configuration Release -derivedDataPath local-build CODE_SIGNING_ALLOWED=NO\
        \ ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build > local-evidence/build.log 2>&1 ||\
        \ { tail -120 local-evidence/build.log; exit 1; }\ncmp local-evidence/Package.resolved\
        \ \"$graph\"\npython3 - <<'PYCODE'\nimport hashlib,json,os\nfrom pathlib import\
        \ Path\nraw=Path('local-evidence/Package.resolved').read_bytes()\npatch=json.loads(Path('probes/diarizer-eof/manifest.json').read_text())\n\
        for name,h in patch['files'].items():\n    assert hashlib.sha256((Path('local-build/SourcePackages/checkouts/FluidAudio')/name).read_bytes()).hexdigest()==h['after'],\
        \ name\nfrozen=os.environ['USE_FROZEN']=='true'\nif frozen and raw!=Path('frozen/Package.resolved').read_bytes():\
        \ raise SystemExit('Frozen dependency graph changed')\nPath('local-evidence/dependency-evidence.json').write_text(json.dumps(dict(sourceCommit=os.environ['GITHUB_SHA'],dependencyGraphSHA256=hashlib.sha256(raw).hexdigest(),dependencyMode='diagnostic-hash-patched-shared-frozen-graph'\
        \ if frozen else 'diagnostic-hash-patched-independently-resolved',frozenGraphVerified=frozen),indent=2))\n\
        PYCODE\n"
    - name: Require actual retained-source pipeline with networking denied
      run: 'sandbox-exec -p ''(version 1)(allow default)(deny network*)'' local-build/Build/Products/Release/LocalStudioDiagnostic
        VoiceMatrix/Resources local-evidence/complete-source.wav tests/fixtures/DiagnosticVoices
        local-evidence/isolated-work local-evidence/pipeline-evidence.json "$GITHUB_SHA"
        audio local-evidence/transcript.txt

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Full-retained-speaker-route-evidence
        path: local-evidence/**
        if-no-files-found: error
        retention-days: 14
'on':
  push:
    branches:
    - diagnostic/full-retained-speaker-route
