name: Independent pinned build17 IPA inspection (no release)
'on':
  push:
    branches: [verification/standalone-mkv-ipa-inspection]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        path: verifier
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: 0064f4acba7d71a13e1730707fdd4cf683909c4c
        path: target
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify inspection regressions
      working-directory: verifier
      run: python3 -m unittest tests.test_independent_build17_inspection -v
    - name: Authenticate exact artifact and run before downloading
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir evidence
        gh api repos/R347H4CK3R/VoiceMatrix-Development/actions/artifacts/14406432049 > evidence/artifact-metadata.json
        gh api repos/R347H4CK3R/VoiceMatrix-Development/actions/runs/44253624669 > evidence/run-metadata.json
        python3 verifier/tools/verification/inspect_build17_artifact.py metadata evidence/artifact-metadata.json evidence/run-metadata.json
        gh api repos/R347H4CK3R/VoiceMatrix-Development/actions/artifacts/14406432049/zip > original-artifact.zip
    - name: Verify and inspect original IPA without rebuilding or publishing
      shell: bash
      run: |
        set -euo pipefail
        python3 verifier/tools/verification/inspect_build17_artifact.py inspect original-artifact.zip target evidence
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Independent-build17-IPA-inspection
        path: evidence
        if-no-files-found: error
        retention-days: 14
