name: VoiceMatrix build 8 inspected unfinished preview package
'on':
  push:
    branches:
    - preview/voicematrix-build8
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install test dependencies and verify package regressions
      run: 'command -v ffmpeg >/dev/null || brew install ffmpeg

        python3 -m pip install -r tests/requirements-native.txt

        python3 -m unittest tests.test_preview_build8 tests.test_package_ipa tests.test_local_media_import
        -v'
    - name: Create real media fixtures
      run: 'command -v ffmpeg >/dev/null || brew install ffmpeg

        mkdir reference-audio-fixtures

        ffmpeg -v error -f lavfi -i ''sine=frequency=440:duration=2'' -ac 2 -ar 44100 reference-audio-fixtures/complete.wav

        ffmpeg -v error -f lavfi -i ''color=c=purple:s=160x90:d=3'' -f lavfi -i ''sine=frequency=440:duration=1''
        -c:v mpeg4 -c:a aac reference-audio-fixtures/short-audio.mp4

        ffmpeg -v error -f lavfi -i ''color=c=purple:s=160x90:d=3'' -itsoffset 0.2 -f lavfi -i ''sine=frequency=440:duration=2''
        -c:v mpeg4 -c:a pcm_s16le reference-audio-fixtures/offset-audio.mov

        ffprobe -v error -select_streams a:0 -show_entries stream=start_time,duration -of json reference-audio-fixtures/offset-audio.mov
        > reference-offset-metadata.json

        '
    - name: Compile production extraction and run real AVFoundation checks
      run: 'set -o pipefail

        swiftc -parse-as-library VoiceMatrix/LocalStudioEvidence.swift VoiceMatrix/LocalVideoAudio.swift
        probes/native-reference-audio/Checks.swift -o reference-audio-checks

        ./reference-audio-checks reference-audio-fixtures 2>&1 | tee reference-audio-results.log

        '
    - uses: actions/download-artifact@v4
      with:
        name: Character-frozen-dependencies
        path: frozen
    - uses: actions/cache@v4
      with:
        path: character-cache
        key: character-assets-685e8816-716d2f41
    - name: Stage pinned shared engines with zero bundled profiles
      run: "python3 tools/bundle_diarization.py\npython3 tools/bundle_asr.py\npython3 tools/character_package.py\
        \ prepare --cache character-cache --resources character-resources  > assets.json\npython3 - <<'PYCODE'\n\
        from pathlib import Path\nimport shutil\nfor name in ('Phonon','OpenVoice','F5TTS'):\n    target=Path('VoiceMatrix/Resources')/name\n\
        \    if target.is_symlink():raise SystemExit('Unexpected resource symlink')\n    if target.exists():shutil.rmtree(target)\n\
        \    shutil.copytree(Path('character-resources')/name,target)\nPYCODE"
    - name: Resolve frozen graph
      run: 'brew install xcodegen

        mkdir -p VoiceMatrix/Resources/{Phonon,OpenVoice,F5TTS}

        python3 tools/create_diagnostic_collection.py

        xcodegen generate

        mkdir -p VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm

        cp frozen/Package.resolved VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

        xcodebuild -resolvePackageDependencies -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile
        -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -derivedDataPath native-build > resolve.log
        2>&1 || { tail -100 resolve.log; exit 1; }

        python3 -m tools.character_evidence source VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
        source-proof.json


        cmp frozen/Package.resolved VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

        shasum -a 256 frozen/Package.resolved > frozen-package.sha256

        '
    - name: Collect dependency licenses and compile unsigned ARM64 app
      run: 'python3 tools/character_package.py notices --checkouts native-build/SourcePackages/checkouts
        --resolved VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved --resources
        VoiceMatrix/Resources > dependency-notices.json

        xcodebuild -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation
        -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -configuration Release -sdk iphoneos -destination
        ''generic/platform=iOS'' -derivedDataPath native-build CODE_SIGNING_ALLOWED=NO build > character-build.log
        2>&1 || { tail -160 character-build.log; exit 1; }

        mkdir Payload

        cp -R native-build/Build/Products/Release-iphoneos/VoiceMatrix.app Payload/

        cp source-proof.json Payload/VoiceMatrix.app/VoiceMatrix-Source-Proof.json

        python3 tools/package_ipa.py Payload VoiceMatrix-0.4.9-build8.ipa

        python3 tools/character_package.py inspect VoiceMatrix-0.4.9-build8.ipa --expected-version 0.4.9
        --expected-build 8 --dependency-proof dependency-notices.json > character-inspection.json

        python3 tools/bundle_diarization.py --inspect-ipa VoiceMatrix-0.4.9-build8.ipa

        python3 tools/bundle_asr.py --inspect-ipa VoiceMatrix-0.4.9-build8.ipa

        shasum -a 256 VoiceMatrix-0.4.9-build8.ipa > character-ipa.sha256


        cmp frozen/Package.resolved VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

        shasum -a 256 -c frozen-package.sha256

        '
    - name: Record packaging-only verification boundary
      run: 'python3 - <<''PYCODE''

        import json,os,pathlib

        pathlib.Path(''packaging-status.json'').write_text(json.dumps(dict(sourceCommit=os.environ[''GITHUB_SHA''],version=''0.4.9'',build=''8'',nativeTestsRun=False,hostExtractionTestsPassed=True,physicalDeviceVerified=False,likenessVerified=False,offlineRVC=False,diagnosticRVCPackImport=True,musicSeparation=False,purpose=''Unsigned
        iPhone preview; packaging and asset inspection only''),indent=2)+''\n'')

        PYCODE'
    - uses: actions/upload-artifact@v4
      with:
        name: Character-test-IPA
        path: 'VoiceMatrix-0.4.9-build8.ipa

          character-inspection.json

          character-ipa.sha256

          source-proof.json

          dependency-notices.json

          assets.json

          packaging-status.json'
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: Character-test-build-log
        path: 'character-build.log

          resolve.log

          reference-audio-results.log

          reference-offset-metadata.json

          frozen-package.sha256'
        if-no-files-found: error
        retention-days: 14
      if: always()
    needs: resolve
  resolve:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Freeze exact shared package graph
      run: 'brew install xcodegen

        mkdir -p VoiceMatrix/Resources/{Phonon,OpenVoice,F5TTS}

        python3 tools/create_diagnostic_collection.py

        xcodegen generate

        xcodebuild -resolvePackageDependencies -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -derivedDataPath
        native-build > resolve.log 2>&1 || { tail -100 resolve.log; exit 1; }

        cp VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved Package.resolved'
    - uses: actions/upload-artifact@v4
      with:
        name: Character-frozen-dependencies
        path: Package.resolved
        if-no-files-found: error
        retention-days: 14
