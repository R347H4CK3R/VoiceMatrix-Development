name: VoiceMatrix vocals reference handoff artifact-only preview
'on':
  push:
    branches:
    - packaging/separated-vocals-reference-preview
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: cd235ec71960a3586a267dcdfd8a94d8a4e69d0f
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: packaging-harness
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install test dependencies and verify package regressions
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        command -v ffmpeg >/dev/null || brew install ffmpeg

        python3 -m pip install -r tests/requirements-native.txt

        python3 -m unittest tests.test_offline_human_fixtures tests.test_preview_build17 tests.test_speaker_handoff tests.test_fresh_acquisition_retry tests.test_reference_source_consent tests.test_standalone_queue_wiring tests.test_rvc_local_routes tests.test_acquisition_diagnostics tests.test_raw_overlap_policy tests.test_reference_candidate_pool tests.test_package_ipa tests.test_local_media_import tests.test_vendored_fluid tests.test_character_package -v'
    - name: Verify isolated packaging harness policy and ZIP regressions
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        (cd packaging-harness && test "$(git rev-parse HEAD)" = "$PACKAGING_WORKFLOW_COMMIT" && python3 -m unittest tests.test_vocals_reference_preview_package -v)

        '
    - name: Create real media fixtures
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        command -v ffmpeg >/dev/null || brew install ffmpeg

        mkdir reference-audio-fixtures

        ffmpeg -v error -f lavfi -i ''sine=frequency=440:duration=2'' -ac 2 -ar 44100 reference-audio-fixtures/complete.wav

        ffmpeg -v error -f lavfi -i ''color=c=purple:s=160x90:d=3'' -f lavfi -i ''sine=frequency=440:duration=1'' -c:v mpeg4 -c:a aac reference-audio-fixtures/short-audio.mp4

        ffmpeg -v error -f lavfi -i ''color=c=purple:s=160x90:d=3'' -itsoffset 0.2 -f lavfi -i ''sine=frequency=440:duration=2'' -c:v mpeg4 -c:a pcm_s16le reference-audio-fixtures/offset-audio.mov

        ffprobe -v error -select_streams a:0 -show_entries stream=start_time,duration -of json reference-audio-fixtures/offset-audio.mov > reference-offset-metadata.json

        '
    - name: Compile production extraction and run real AVFoundation checks
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        set -o pipefail

        swiftc -parse-as-library VoiceMatrix/LocalStudioEvidence.swift VoiceMatrix/LocalVideoAudio.swift probes/native-reference-audio/Checks.swift -o reference-audio-checks

        ./reference-audio-checks reference-audio-fixtures 2>&1 | tee reference-audio-results.log

        '
    - uses: actions/download-artifact@v4
      with:
        name: Vocals-reference-preview-Character-frozen-dependencies
        path: frozen
    - uses: actions/cache@v4
      with:
        path: character-cache
        key: character-assets-685e8816-716d2f41
    - name: Stage pinned shared engines with zero bundled profiles
      run: "set -e\nactual_source=$(git rev-parse HEAD)\ntest \"$actual_source\" = \"$TARGET_SOURCE\"\n# Build evidence must name the immutable app source, not this workflow commit.\nexport GITHUB_SHA=\"$actual_source\"\npython3 tools/bundle_diarization.py\npython3 tools/bundle_asr.py\npython3 tools/character_package.py prepare --cache character-cache --resources character-resources  > assets.json\npython3 - <<'PYCODE'\nfrom pathlib import Path\nimport shutil\nfor name in ('Phonon','OpenVoice','F5TTS'):\n    target=Path('VoiceMatrix/Resources')/name\n    if target.is_symlink():raise SystemExit('Unexpected resource symlink')\n    if target.exists():shutil.rmtree(target)\n    shutil.copytree(Path('character-resources')/name,target)\nPYCODE"
    - name: Verify exact vendored source before compilation
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        python3 tools/vendored_fluid.py > vendor-before.json'
    - name: Stage exact licensed vocal separation models before project generation
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        python3 tools/prepare_vocal_separation.py --output VoiceMatrix/Resources/Separation

        '
    - name: Resolve frozen graph
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        brew install xcodegen

        mkdir -p VoiceMatrix/Resources/{Phonon,OpenVoice,F5TTS}

        python3 tools/create_diagnostic_collection.py

        xcodegen generate

        mkdir -p VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm

        cp frozen/Package.resolved VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

        xcodebuild -resolvePackageDependencies -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -derivedDataPath native-build > resolve.log 2>&1 || { tail -100 resolve.log; exit 1; }

        python3 -m tools.character_evidence source VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved source-proof.json


        cmp frozen/Package.resolved VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

        shasum -a 256 frozen/Package.resolved > frozen-package.sha256

        '
    - name: Collect dependency licenses and compile unsigned ARM64 app
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        python3 tools/character_package.py notices --checkouts native-build/SourcePackages/checkouts --resolved VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved --resources VoiceMatrix/Resources > dependency-notices.json

        xcodebuild -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -configuration Release -sdk iphoneos -destination ''generic/platform=iOS'' -derivedDataPath native-build CODE_SIGNING_ALLOWED=NO build > character-build.log 2>&1 || { tail -160 character-build.log; exit 1; }

        mkdir Payload

        cp -R native-build/Build/Products/Release-iphoneos/VoiceMatrix.app Payload/

        cp source-proof.json Payload/VoiceMatrix.app/VoiceMatrix-Source-Proof.json

        python3 tools/python-runtime/verify_python_bundle.py Payload/VoiceMatrix.app --json-out python-runtime-inspection.json > python-runtime-inspection.log

        python3 tools/package_ipa.py Payload VoiceMatrix-0.4.14-build17-vocals-reference-preview-cd235ec.ipa

        python3 tools/character_package.py inspect VoiceMatrix-0.4.14-build17-vocals-reference-preview-cd235ec.ipa --expected-version 0.4.14 --expected-build 17 --dependency-proof dependency-notices.json > character-inspection.json

        python3 tools/bundle_diarization.py --inspect-ipa VoiceMatrix-0.4.14-build17-vocals-reference-preview-cd235ec.ipa

        python3 tools/bundle_asr.py --inspect-ipa VoiceMatrix-0.4.14-build17-vocals-reference-preview-cd235ec.ipa

        shasum -a 256 VoiceMatrix-0.4.14-build17-vocals-reference-preview-cd235ec.ipa > character-ipa.sha256


        cmp frozen/Package.resolved VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

        shasum -a 256 -c frozen-package.sha256

        python3 tools/vendored_fluid.py > vendor-after.json

        cmp vendor-before.json vendor-after.json

        '
    - name: Independently inspect exact separation models and licenses inside original IPA
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        python3 packaging-harness/tools/verification/inspect_handoff_separation_resources.py VoiceMatrix-0.4.14-build17-vocals-reference-preview-cd235ec.ipa --target . --output separation-inspection.json

        '
    - name: Record packaging-only verification boundary
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        python3 - <<''PYCODE''

        import json,os,pathlib

        pathlib.Path(''packaging-status.json'').write_text(json.dumps(dict(sourceCommit=os.environ[''GITHUB_SHA''],packagingWorkflowCommit=os.environ[''PACKAGING_WORKFLOW_COMMIT''],previewLabel=''vocals-reference-artifact-only'',version=''0.4.14'',build=''17'',nativeTestsRun=False,hostExtractionTestsPassed=True,physicalDeviceVerified=False,likenessVerified=False,offlineRVC=False,diagnosticRVCPackImport=True,musicSeparation=''experimental-up-to-10-second-two-stem-diagnostic'',purpose=''Unsigned vocals reference handoff preview; packaging and asset inspection only''),indent=2)+''\n'')

        PYCODE'
    - uses: actions/upload-artifact@v4
      with:
        name: Vocals-reference-preview-Character-test-IPA
        path: 'VoiceMatrix-0.4.14-build17-vocals-reference-preview-cd235ec.ipa

          python-runtime-inspection.log

          python-runtime-inspection.json

          character-inspection.json

          character-ipa.sha256

          source-proof.json

          dependency-notices.json

          assets.json

          packaging-status.json

          vendor-before.json

          vendor-after.json


          separation-inspection.json'
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: Vocals-reference-preview-Character-test-build-log
        path: 'character-build.log

          resolve.log

          reference-audio-results.log

          reference-offset-metadata.json

          frozen-package.sha256'
        if-no-files-found: error
        retention-days: 14
      if: always()
    needs: resolve
  resolve:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: cd235ec71960a3586a267dcdfd8a94d8a4e69d0f
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Recover the same pinned frozen graph as full-route verification
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -e\nactual_source=$(git rev-parse HEAD)\ntest \"$actual_source\" = \"$TARGET_SOURCE\"\n# Build evidence must name the immutable app source, not this workflow commit.\nexport GITHUB_SHA=\"$actual_source\"\nmkdir -p frozen\n gh api repos/R347H4CK3R/VoiceMatrix-Development/actions/artifacts/14171746105/zip > frozen.zip\n echo '42472557ab8e854fcfd8e3f858da8a7fe06f1fa5d2e8a4962d7e34cd8ed446d5  frozen.zip' | shasum -a 256 -c -\n python3 - <<'PYCODE'\nimport zipfile,pathlib\nwith zipfile.ZipFile('frozen.zip') as z:\n assert z.namelist()==['Package.resolved']\n pathlib.Path('frozen/Package.resolved').write_bytes(z.read('Package.resolved'))\nPYCODE\ncp frozen/Package.resolved Package.resolved\n"
    - name: Migrate only obsolete remote ONNX pin to verified vendored source
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        python3 -m unittest tests.test_frozen_vendored_graph -v

        python3 -m tools.frozen_vendored_graph frozen/Package.resolved

        cp frozen/Package.resolved Package.resolved

        '
    - uses: actions/upload-artifact@v4
      with:
        name: Vocals-reference-preview-Frozen-vendored-graph-receipt
        path: 'frozen/Package.original.resolved

          frozen/Package.resolved

          frozen/vendored-graph-receipt.json

          '
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: Vocals-reference-preview-Character-frozen-dependencies
        path: Package.resolved
        if-no-files-found: error
        retention-days: 14
  native-pipeline:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: cd235ec71960a3586a267dcdfd8a94d8a4e69d0f
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install native fixture test dependencies
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        python3 -m pip install -r tests/requirements-native.txt'
    - uses: actions/download-artifact@v4
      with:
        name: Vocals-reference-preview-Character-frozen-dependencies
        path: frozen
    - uses: actions/cache@v4
      with:
        path: character-cache
        key: character-assets-685e8816-716d2f41
    - name: Validate source and prepare pinned shared assets
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        python3 -m unittest tests.test_real_reference_pool_diagnostic tests.test_local_pipeline_diagnostic tests.test_local_video_studio -v

        python3 tools/bundle_asr.py

        python3 tools/bundle_diarization.py

        python3 tools/character_package.py prepare --cache character-cache --resources character-resources > assets.json

        python3 - <<''PY''

        from pathlib import Path

        import shutil

        target=Path(''VoiceMatrix/Resources/F5TTS'')

        if target.is_symlink(): raise SystemExit(''Unexpected link'')

        if target.exists(): shutil.rmtree(target)

        shutil.copytree(''character-resources/F5TTS'',target)

        PY

        '
    - name: Recover complete pinned human source
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        brew install ffmpeg

        mkdir -p local-evidence

        python3 probes/full-retained-speaker-route/prepare.py local-evidence/first

        python3 probes/second-complete-speaker-route/prepare.py local-evidence/second

        python3 tools/create_diagnostic_collection.py

        '
    - name: Build clean source-vendored dependency and validate native boundary tests
      run: 'set -e

        actual_source=$(git rev-parse HEAD)

        test "$actual_source" = "$TARGET_SOURCE"

        # Build evidence must name the immutable app source, not this workflow commit.

        export GITHUB_SHA="$actual_source"

        test "$(uname -m)" = arm64

        brew install xcodegen

        python3 tools/vendored_fluid.py > local-evidence/vendor-before.json

        swift test --package-path Vendors/FluidAudio --scratch-path vendor-tests --filter EOFTimelineTests > local-evidence/eof-tests.log 2>&1 || { tail -100 local-evidence/eof-tests.log; exit 1; }

        python3 tools/vendored_fluid.py > local-evidence/vendor-after-tests.json

        cmp local-evidence/vendor-before.json local-evidence/vendor-after-tests.json

        mkdir -p VoiceMatrix/Resources/{Phonon,OpenVoice,F5TTS}

        xcodegen generate

        graph=VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

        mkdir -p "$(dirname "$graph")"

        cp frozen/Package.resolved "$graph"

        xcodebuild -resolvePackageDependencies -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme LocalStudioDiagnostic -derivedDataPath local-build > local-evidence/resolve.log 2>&1 || { tail -100 local-evidence/resolve.log; exit 1; }

        cmp frozen/Package.resolved "$graph"

        cp "$graph" local-evidence/Package.resolved

        python3 tools/character_package.py notices --checkouts local-build/SourcePackages/checkouts --resolved "$graph" --resources VoiceMatrix/Resources > local-evidence/dependency-notices.json

        xcodebuild -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme LocalStudioDiagnostic -configuration Release -derivedDataPath local-build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build > local-evidence/build.log 2>&1 || { tail -100 local-evidence/build.log; exit 1; }

        cmp local-evidence/Package.resolved "$graph"

        python3 tools/vendored_fluid.py > local-evidence/vendor-after-build.json

        cmp local-evidence/vendor-before.json local-evidence/vendor-after-build.json

        python3 tools/character_evidence.py source "$graph" local-evidence/source-proof.json

        '
    - name: Run both complete recordings through unchanged coordinator offline
      run: "set -e\nactual_source=$(git rev-parse HEAD)\ntest \"$actual_source\" = \"$TARGET_SOURCE\"\n# Build evidence must name the immutable app source, not this workflow commit.\nexport GITHUB_SHA=\"$actual_source\"\nfor reader in first second; do\n sandbox-exec -p '(version 1)(allow default)(deny network*)' local-build/Build/Products/Release/LocalStudioDiagnostic VoiceMatrix/Resources local-evidence/$reader/complete-source.wav tests/fixtures/DiagnosticVoices local-evidence/$reader/work local-evidence/$reader/pipeline-evidence.json \"$GITHUB_SHA\" audio local-evidence/$reader/transcript.txt\ndone\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Vocals-reference-preview-Build17-native-pipeline-evidence
        path: local-evidence/**
        if-no-files-found: error
        retention-days: 14
    needs: resolve
env:
  TARGET_SOURCE: cd235ec71960a3586a267dcdfd8a94d8a4e69d0f
  PACKAGING_WORKFLOW_COMMIT: ${{ github.sha }}
