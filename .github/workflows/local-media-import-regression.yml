name: Local MP3 and AIFF import regression
'on':
  push:
    branches: [fix/local-audio-format-import]
    paths:
      - .github/workflows/local-media-import-regression.yml
      - VoiceMatrix/LocalMediaImportPolicy.swift
      - VoiceMatrix/LocalVideoAudio.swift
      - VoiceMatrix/LocalVideoStudio.swift
      - VoiceMatrix/LocalVideoStudioView.swift
      - tests/test_local_media_import.py
      - project.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-import:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install fixture encoder if needed
        run: command -v ffmpeg || brew install ffmpeg
      - name: Execute actual production decoder and import admission regressions
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          xcrun swiftc --version > evidence/compiler.txt
          python3 -m unittest discover -s tests -p test_local_media_import.py -v 2>&1 | tee evidence/native-import.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Local-MP3-AIFF-native-import-evidence
          path: evidence
          retention-days: 14
