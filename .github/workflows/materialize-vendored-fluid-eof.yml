name: Materialize reviewed vendored FluidAudio source
on:
  push:
    branches: [diagnostic/materialize-vendored-fluid-eof]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Require new staging branch
      run: |
        git ls-remote --heads origin refs/heads/staging/vendored-fluid-eof > "$RUNNER_TEMP/staging-ref"
        test ! -s "$RUNNER_TEMP/staging-ref"
    - name: Obtain and verify exact licensed source
      run: |
        git clone --filter=blob:none --no-checkout https://github.com/FluidInference/FluidAudio.git "$RUNNER_TEMP/FluidAudio"
        git -C "$RUNNER_TEMP/FluidAudio" checkout --detach ee78635d23d52379117554ba72358b65a0612447
        python3 probes/vendored-fluid-bootstrap/materialize.py "$RUNNER_TEMP/FluidAudio"
        python3 -m pip install PyYAML
        python3 -m unittest tests.test_vendored_fluid tests.test_character_package tests.test_character_evidence -v
        git diff --quiet
        git push --force-with-lease=refs/heads/staging/vendored-fluid-eof: origin HEAD:refs/heads/staging/vendored-fluid-eof
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Vendored-source-materialization-proof
        path: materialization-proof.json
        if-no-files-found: error
        retention-days: 14
