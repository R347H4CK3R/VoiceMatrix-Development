name: Same-SDK Metal architecture input diagnostic (no release)
on:
  push:
    branches: [verification/metal-arch-diagnostic]
permissions:
  contents: read
concurrency:
  group: metal-arch-diagnostic
  cancel-in-progress: false
jobs:
  measure:
    if: github.repository == 'R347H4CK3R/VoiceMatrix-Development' && github.ref == 'refs/heads/verification/metal-arch-diagnostic'
    runs-on: macos-26
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Recheck the known SDK and simulator, then measure nullable inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          test "$(xcodebuild -version | head -1)" = "Xcode 26.6"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "26.5"
          mkdir diagnostic-metadata
          git rev-parse HEAD > diagnostic-metadata/source-sha.txt
          git rev-parse HEAD^{tree} > diagnostic-metadata/source-tree.txt
          xcodebuild -version > diagnostic-metadata/xcode.txt
          xcrun --sdk iphonesimulator --show-sdk-version > diagnostic-metadata/sdk.txt
          # Original failure's runtime is iOS 26.2 even though its build SDK is 26.5.
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-26-2"]; print(next(x["udid"] for x in d if x["isAvailable"] and x["name"]=="iPhone 17 Pro"))')
          printf '%s\n' 'iOS 26.2 / iPhone 17 Pro simulator' > diagnostic-metadata/runtime.txt
          bash probes/metal-arch-diagnostic/run.sh "$DEVICE" | tee diagnostic-metadata/metal-architecture.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: metal-architecture-metadata-only
          path: diagnostic-metadata/
          if-no-files-found: warn
          retention-days: 7
