name: Native F5 offline audio benchmark
permissions:
  contents: read
jobs:
  offline-audio:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Check actual Metal device before downloading weights
      run: 'xcrun swift -e ''import Metal; guard let device = MTLCreateSystemDefaultDevice()
        else { fatalError("No Metal device on this hosted runner; native audio benchmarking
        requires another Apple executor.") }; print(device.name)''

        '
    - run: brew install xcodegen
    - uses: actions/cache@v4
      with:
        path: native-f5-weights
        key: f5-mlx-fp16-685e88161a2841a5f102a6f8094613ba7131e350
    - name: Acquire and checksum pinned shared engine during development
      run: "python3 - <<'PY'\nimport hashlib,json,pathlib,urllib.request\nrevision='685e88161a2841a5f102a6f8094613ba7131e350'\n\
        repo='aufklarer/F5TTS-v1-Base-MLX-fp16'\nroot=pathlib.Path('native-f5-weights');root.mkdir(exist_ok=True)\n\
        url='https://huggingface.co/api/models/'+repo+'/revision/'+revision+'?blobs=true'\n\
        info=json.load(urllib.request.urlopen(url))\nassert info['sha']==revision\n\
        siblings={x['rfilename']:x for x in info['siblings']}\nfiles=['README.md','config.json','model.safetensors','vocos.safetensors','vocos_config.yaml','vocab.txt','pinyin_lexicon.tsv']\n\
        checks=[]\nfor name in files:\n  meta=siblings[name];path=root/name\n  expected=meta.get('lfs',{}).get('sha256')\n\
        \  def digest():\n    with path.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()\n\
        \  if not path.exists() or (expected and digest()!=expected):\n    with urllib.request.urlopen('https://huggingface.co/'+repo+'/resolve/'+revision+'/'+name)\
        \ as response,path.open('wb') as f:\n      while data:=response.read(1048576):f.write(data)\n\
        \  actual=digest()\n  assert path.stat().st_size==meta['size']\n  if expected:assert\
        \ actual==expected\n  checks.append(dict(path=name,size=path.stat().st_size,sha256=actual))\n\
        (root/'voicematrix-engine.json').write_text(json.dumps(dict(schemaVersion=1,engine='F5TTS_v1_Base',runtimeRevision='a57702e6f523fa36ac5532d2bdc5f35f701a052c',modelRepository=repo,modelRevision=revision,files=checks),indent=2))\n\
        PY\n"
    - name: Build native benchmark tool
      working-directory: probes/native-f5
      run: 'xcodegen generate --spec benchmark.yml

        xcodebuild -skipPackagePluginValidation -project NativeF5Benchmark.xcodeproj
        -scheme NativeF5Benchmark -configuration Release -derivedDataPath benchmark-build
        CODE_SIGNING_ALLOWED=NO build > native-f5-audio-build.log 2>&1 || { tail -120
        native-f5-audio-build.log; exit 1; }

        '
    - name: Generate, decode and measure with network access denied
      run: 'say -r 150 -o reference.aiff "This is a clear reference recording. Today
        we are checking an offline speech engine."

        sandbox-exec -p ''(version 1)(allow default)(deny network*)'' probes/native-f5/benchmark-build/Build/Products/Release/NativeF5Benchmark
        native-f5-weights reference.aiff native-f5-diagnostic.wav native-f5-audio.json

        cat native-f5-audio.json

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Native-F5-audio-evidence
        path: 'native-f5-audio.json

          native-f5-diagnostic.wav

          probes/native-f5/native-f5-audio-build.log

          '
        if-no-files-found: warn
'on':
  push:
    branches-ignore:
    - codex/iphone-build4
    - codex/iphone-build5
    - codex/iphone-build6
    paths:
    - .github/workflows/native-f5-audio.yml
    - probes/native-f5/Benchmark.swift
    - probes/native-f5/benchmark.yml
  workflow_dispatch: null
