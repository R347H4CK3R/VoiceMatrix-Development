name: Native queue UI checks
permissions:
  contents: read
jobs:
  native-queue:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Typecheck queue screen against iPhone SDK
      run: 'SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"

        xcrun swiftc -typecheck -sdk "$SDKROOT" -target arm64-apple-ios26.0 VoiceMatrix/VideoQueueView.swift
        VoiceMatrix/VideoCandidateRequest.swift VoiceMatrix/LaptopConnection.swift
        VoiceMatrix/VoiceFolderSync.swift VoiceMatrix/VoiceSyncLog.swift VoiceMatrix/VideoWorkflow.swift
        VoiceMatrix/VideoWorkflowView.swift

        '
    - name: Execute workflow model, cancellation and privacy checks
      run: "xcrun swiftc -parse-as-library VoiceMatrix/VideoWorkflow.swift tests/native/VideoWorkflowChecks.swift\
        \ -o /tmp/workflow-checks\npython3 - <<'PY'\nimport json,tempfile,pathlib\n\
        from tools.video_queue import VideoQueue\nfrom tools.workflow_activity import\
        \ snapshot\nwith tempfile.TemporaryDirectory() as directory:\n    database=pathlib.Path(directory)/'queue.db'\n\
        \    queue=VideoQueue(str(database));queue.add(['https://youtu.be/EAT0nWoEzJ8']);queue.close()\n\
        \    pathlib.Path('/tmp/workflow-fixture.json').write_text(json.dumps(snapshot(database)))\n\
        PY\n/tmp/workflow-checks /tmp/workflow-fixture.json\n"
    - name: Execute explicit candidate request and receipt checks
      run: 'xcrun swiftc -parse-as-library VoiceMatrix/VideoWorkflow.swift VoiceMatrix/VideoCandidateRequest.swift
        tests/native/VideoCandidateRequestChecks.swift -o /tmp/candidate-request-checks

        /tmp/candidate-request-checks

        '
'on':
  push:
    branches:
    - preview/voicematrix-build12
  workflow_dispatch: null
