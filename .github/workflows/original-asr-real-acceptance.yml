# Draft: install as the single workflow on the isolated live branch only after independent review.
name: Production route original-frontend ASR fixture diagnostic
on:
  push:
    branches:
      - verification/original-asr-real-acceptance-v1
    paths:
      - .github/workflows/original-asr-real-acceptance.yml
permissions:
  contents: read
concurrency:
  group: voicematrix-original-frontend-real-acceptance-v1
  cancel-in-progress: false

jobs:
  exact-production-route:
    if: ${{ github.repository == 'R347H4CK3R/VoiceMatrix-Development' && github.ref == 'refs/heads/verification/original-asr-real-acceptance-v1' && github.event.deleted == false }}
    runs-on: macos-26
    timeout-minutes: 35
    env:
      SOURCE_SHA: 42da8f3ed18ca1c0f1462032db5dc05ce77362a1
      SOURCE_TREE_SHA: 24e298cb887b1a6bf19c177c0733e06f5a474bfc
      VENDOR_TREE_SHA: fd8de45f50a351b87f199ae7fe168ecedb63e3ee
      ADAPTER_BASE_SHA: 4ed344a8bb859e841c35041f3f07b9510a930492
      NEMO_BINARY_SHA256: 5fa8c10d4ec26c1bb2413125f351a7222a4c68a23b74476680fbada7e26fc6aa
      MODEL_LOCK_SHA256: f58c59e24e41e17f701d7b2b7fc4aa45343c232a2119fb6540357f676a6416ce
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate reviewed selectors and native runner
        run: |
          set -euo pipefail
          for selector in "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$VENDOR_TREE_SHA" "$ADAPTER_BASE_SHA" "$GITHUB_SHA"; do
            [[ "$selector" =~ ^[a-f0-9]{40}$ ]]
          done
          [[ "$MODEL_LOCK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" && "$SOURCE_SHA" != "$GITHUB_SHA" ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          evidence="$RUNNER_TEMP/asr-real-evidence"
          mkdir -m 700 "$evidence"
          {
            printf 'source_sha=%s\nsource_tree=%s\nvendor_tree=%s\nadapter_base_sha=%s\nworkflow_event_sha=%s\nworkflow_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$VENDOR_TREE_SHA" "$ADAPTER_BASE_SHA" "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
          } > "$evidence/runtime.txt"
      - name: Checkout only the exact reviewed source commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: product
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Select exact macOS ARM64 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: arm64
      - name: Recheck source and vendor tree and run offline contracts
        working-directory: product
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(git show -s --format=%P HEAD)" == "$ADAPTER_BASE_SHA" ]]
          git cat-file -e "$ADAPTER_BASE_SHA^{commit}"
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$SOURCE_TREE_SHA" ]]
          [[ "$(git rev-parse 'HEAD:Vendors/FluidAudio')" == "$VENDOR_TREE_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- Vendors/FluidAudio)" ]]
          [[ -d Vendors/FluidAudio && ! -L Vendors/FluidAudio ]]
          python -I -c 'import platform,sys; assert sys.version_info[:3]==(3,12,10) and platform.machine()=="arm64"'
          evidence="$RUNNER_TEMP/asr-real-evidence"
          python -I --version >> "$evidence/runtime.txt"
          [[ "$(shasum -a 256 probes/native-original-asr/resource-lock.json | cut -d ' ' -f 1)" == "$MODEL_LOCK_SHA256" ]]
          {
            python -m unittest tests.test_original_asr_adapter -v
            python -m unittest discover -s probes/native-original-asr -v
            python probes/native-original-asr/stage_models.py --validate-only
            python probes/native-original-asr/prepare_diagnostic.py "$RUNNER_TEMP/asr-real-work" "$SOURCE_SHA"
          } 2>&1 | tee "$evidence/preflight.log"
          cp "$RUNNER_TEMP/asr-real-work/source-proof.json" "$evidence/source-proof.json"
          cp probes/native-original-asr/resource-lock.json "$evidence/model-resource-lock.json"
      - name: Resolve the one declared vendor binary dependency before the offline build
        working-directory: product
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/asr-real-evidence"
          package="$RUNNER_TEMP/asr-real-work/probes/native-original-asr"
          scratch="$RUNNER_TEMP/asr-real-build"
          # Keep the vendored package's default traits (including NemoTextProcessing).
          # The declared official binary dependency is separate from the ASR model transfer budget.
          binary_url='https://github.com/FluidInference/text-processing-rs/releases/download/v0.3.1/NemoTextProcessing.xcframework.zip'
          for manifest in Vendors/FluidAudio/Package.swift Vendors/FluidAudio/Package@swift-6.2.swift; do
            grep -Fq "$binary_url" "$manifest"
            grep -Fq "$NEMO_BINARY_SHA256" "$manifest"
          done
          {
            printf 'swiftpm_declared_binary_dependency=%s\nswiftpm_declared_binary_sha256=%s\n' "$binary_url" "$NEMO_BINARY_SHA256"
            printf 'asr_model_download_budget=631653214; excludes build tools, dependencies and corpus fixtures\n'
          } >> "$evidence/runtime.txt"
          swift package --package-path "$package" --scratch-path "$scratch" resolve 2>&1 | tee "$evidence/swift-resolve.log"
      - name: Compile exact production recognizer with networking denied
        working-directory: product
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/asr-real-evidence"
          package="$RUNNER_TEMP/asr-real-work/probes/native-original-asr"
          scratch="$RUNNER_TEMP/asr-real-build"
          profile='(version 1)(allow default)(deny network*)'
          # Outer Seatbelt denies networking. Disable only SwiftPM's nested manifest sandbox
          # to avoid nesting an application sandbox for these already reviewed local manifests.
          /usr/bin/sandbox-exec -p "$profile" swift build --disable-sandbox \
            --package-path "$package" --scratch-path "$scratch" -c release --product Probe 2>&1 | tee "$evidence/build.log"
          exe="$(/usr/bin/sandbox-exec -p "$profile" swift build --disable-sandbox \
            --package-path "$package" --scratch-path "$scratch" -c release --show-bin-path)/Probe"
          [[ -x "$exe" && "$exe" == "$scratch/"* ]]
          printf '%s\n' "$exe" > "$RUNNER_TEMP/asr-real-executable-path"
          [[ "$(git rev-parse 'HEAD:Vendors/FluidAudio')" == "$VENDOR_TREE_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- Vendors/FluidAudio)" ]]
      - name: Recover unchanged four complete human holdouts
        working-directory: product
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/asr-real-evidence"
          human="$RUNNER_TEMP/asr-real-human"
          {
            if ! command -v ffmpeg >/dev/null; then
              /opt/homebrew/bin/brew install ffmpeg
            fi
            ffmpeg_bin="$(command -v ffmpeg)"
            [[ "$ffmpeg_bin" == /* && -f "$ffmpeg_bin" && -x "$ffmpeg_bin" ]]
            ffmpeg_sha="$(shasum -a 256 "$ffmpeg_bin" | cut -d ' ' -f 1)"
            [[ "$ffmpeg_sha" =~ ^[a-f0-9]{64}$ ]]
            printf 'ffmpeg_executable=%s\nffmpeg_executable_sha256=%s\n' "$ffmpeg_bin" "$ffmpeg_sha"
            "$ffmpeg_bin" -version
            # Record the install/toolchain boundary; a binary digest is not a bit-reproducibility claim.
            printf '%s\n' 'Official runner or Homebrew FFmpeg only. This diagnostic does not assert bit-reproducible corpus decoding/toolchain.'
            /opt/homebrew/bin/brew config
            /opt/homebrew/bin/brew list --versions ffmpeg || true
            # Existing preparer verifies the immutable source pins and decodes every entire clip.
            [[ "$(shasum -a 256 probes/reference-context-human-holdouts/sources.json | cut -d ' ' -f 1)" == \
              00d13f6b6054551da772c5566eb7f65ade4017ac58e5132cef7931720c83f9b8 ]]
            python probes/reference-context-human-holdouts/prepare.py "$human"
          } 2>&1 | tee "$evidence/human-preparation.log"
          cp "$human/manifest.json" "$evidence/human-manifest.json"
      - name: Stage the exact approved 16 remote files once, ephemeral only
        working-directory: product
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/asr-real-evidence"
          models="$RUNNER_TEMP/asr-real-models"
          python probes/native-original-asr/stage_models.py --destination "$models" 2>&1 | tee "$evidence/staging.log"
          [[ "$(shasum -a 256 "$models/resource-lock.json" | cut -d ' ' -f 1)" == "$MODEL_LOCK_SHA256" ]]
      - name: Run actual application ASR on fixed fixtures with networking denied
        working-directory: product
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/asr-real-evidence"
          exe="$(cat "$RUNNER_TEMP/asr-real-executable-path")"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' "$exe" \
            "$RUNNER_TEMP/asr-real-work/fixtures" "$RUNNER_TEMP/asr-real-human" "$RUNNER_TEMP/asr-real-models" \
            "$evidence/result.json" "$SOURCE_SHA" 2>&1 | tee "$evidence/recognition.log"
          python -I - "$evidence/result.json" "$SOURCE_SHA" <<'PY'
          import json,sys
          with open(sys.argv[1]) as stream:
              report=json.load(stream)
          assert report["status"]=="NARROW_PRODUCTION_ASR_FIXTURES_PASSED_NO_DEVICE_CLAIM"
          assert report["sourceCommit"]==sys.argv[2] and len(report["results"])==12
          assert report["physicalDeviceVerified"] is False and report["fullLocalPipelineVerified"] is False
          assert report["cancelledRequestRejected"] is True and report["retryAfterCancellationPassed"] is True
          PY
      - name: Upload only narrow evidence (no fixture audio, binaries, or models)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: original-frontend-production-asr-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/asr-real-evidence/runtime.txt
            ${{ runner.temp }}/asr-real-evidence/preflight.log
            ${{ runner.temp }}/asr-real-evidence/source-proof.json
            ${{ runner.temp }}/asr-real-evidence/swift-resolve.log
            ${{ runner.temp }}/asr-real-evidence/build.log
            ${{ runner.temp }}/asr-real-evidence/human-preparation.log
            ${{ runner.temp }}/asr-real-evidence/human-manifest.json
            ${{ runner.temp }}/asr-real-evidence/model-resource-lock.json
            ${{ runner.temp }}/asr-real-evidence/staging.log
            ${{ runner.temp }}/asr-real-evidence/recognition.log
            ${{ runner.temp }}/asr-real-evidence/result.json
          if-no-files-found: warn
          retention-days: 7
