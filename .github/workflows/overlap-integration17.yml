name: Build17 actual raw-overlap integration and crop screening
'on':
  push:
    branches:
    - preview/voicematrix-build17
    - feature/voicematrix-download-diagnostics
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 3
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify deterministic ground-truth transforms
      run: 'python3 -m unittest discover -s tests -p test_overlap_stress.py -v

        python3 tools/vendored_fluid.py > vendor-before.json

        '
    - name: Stage exact licensed recordings and pinned native models
      run: 'command -v ffmpeg >/dev/null || brew install ffmpeg

        python3 probes/overlap-stress/prepare.py overlap-evidence

        python3 tools/bundle_diarization.py --destination "$RUNNER_TEMP/diarization-models"

        '
    - name: Build current production adapter and retain exact source hashes
      run: "for file in LocalSpeakerDiarization LocalOverlapPolicy LocalSpeakerPolicy\
        \ LocalVideoAudio LocalStudioEvidence LocalSoundQuality LocalSoundQualityPolicy;\
        \ do\n  cp VoiceMatrix/$file.swift probes/overlap-stress/Sources/Probe/\n\
        done\npython3 - <<'PY'\nimport hashlib,json,pathlib,os\nnames=['LocalSpeakerDiarization','LocalOverlapPolicy','LocalSpeakerPolicy','LocalVideoAudio','LocalStudioEvidence','LocalSoundQuality','LocalSoundQualityPolicy']\n\
        pathlib.Path('overlap-evidence/source-proof.json').write_text(json.dumps({'candidate':os.environ['GITHUB_SHA'],'diagnosticCommit':os.environ['GITHUB_SHA'],'sources':{n:hashlib.sha256(pathlib.Path('VoiceMatrix',n+'.swift').read_bytes()).hexdigest()\
        \ for n in names},'productionChanged':True},indent=2))\nPY\nswift build --package-path\
        \ probes/overlap-stress -c release > overlap-evidence/build.log 2>&1 || {\
        \ tail -100 overlap-evidence/build.log; exit 1; }\npython3 tools/vendored_fluid.py\
        \ > vendor-after.json\ncmp vendor-before.json vendor-after.json\ncp vendor-before.json\
        \ vendor-after.json overlap-evidence/"
    - name: Measure every predeclared mixture without network
      run: "python3 - <<'PY'\nimport json,pathlib,subprocess,os\nroot=pathlib.Path('overlap-evidence');cases=json.loads((root/'manifest.json').read_text())['cases'];runs=[]\n\
        for c in cases:\n  with (root/(c['id']+'.log')).open('w') as log:\n    try:\n\
        \      r=subprocess.run(['sandbox-exec','-p','(version 1)(allow default)(deny\
        \ network*)','probes/overlap-stress/.build/release/Probe',os.environ['RUNNER_TEMP']+'/diarization-models',str(root/c['file']),c['sha256'],str(root/(c['id']+'-analysis.json'))],stdout=log,stderr=subprocess.STDOUT,timeout=480)\n\
        \      runs.append({'case':c['id'],'exitCode':r.returncode})\n    except subprocess.TimeoutExpired:runs.append({'case':c['id'],'timeout':True})\n\
        \  (root/'execution.json').write_text(json.dumps(runs,indent=2))\nsubprocess.run(['python3','probes/overlap-stress/measure.py',str(root)],check=True)\n\
        assert len(runs)==5 and all(r.get('exitCode')==0 for r in runs),'Incomplete\
        \ diagnostic; preserve all outcomes'\nPY\n"
    - name: Require clean controls and observed overlap vetoes
      run: python3 probes/overlap-stress/verify_guard.py overlap-evidence
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Build17-overlap-integration
        path: overlap-evidence
        if-no-files-found: error
        retention-days: 14
