name: Physical audit ARM64 build (metadata only; no delivery)
on:
  push:
    branches: [verification/physical-audit-arm64]
permissions:
  contents: read
concurrency:
  group: physical-audit-arm64-metadata-only
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'R347H4CK3R/VoiceMatrix-Development' && github.ref == 'refs/heads/verification/physical-audit-arm64' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require exact public source and externally approved hosted scope
        env:
          ALLOWED_CODE_PARENT: 90de4fa8b71a298629f5648e58ed419c30209e67
          APPROVAL_SHA256: c786da9f59c7a1893b70fdb4edbeaa0a1916fe821716c617b4af59ca0cdc5617
          APPROVAL_JSON: '{"approvalDateUTC":"2026-11-19","approvedBy":"Coordinating maintainer (one exact metadata-only native-build diagnostic)","baselineIPA":{"sha256":"04d199d356a5fde59101d3909a35abf05e8dd1129141e0add66e1e45006c5d11","size":1330407101},"graphSHA256":"2d2f397374be883181f421002ba25ef80231dab94ed331d7651bb4ebe68ee5f6","iphoneOSSDK":"26.5","modelLocks":{"Diarization":"137ad0aba1483d0ba3c74cb5380ab05f5cd76a5eb47aa69b9de41c353315e7e0","F5TTS":"e51680c87462bb26433613fe61f7da735c59ab770020f5705a6159cda78bdb70","ParakeetASR":"f58c59e24e41e17f701d7b2b7fc4aa45343c232a2119fb6540357f676a6416ce"},"noFurtherDistribution":true,"noPersonalRecordings":true,"runtimeRevision":"42da8f3ed18ca1c0f1462032db5dc05ce77362a1","schemaVersion":1,"scope":"private-noncommercial-hardware-audit-only","xcodeVersion":"Xcode 26.6","xcodegenSHA256":"a450f63bdd650c280cfce0fef6c94dbb19c5bf8dc32811361fd5d2e912718503"}'
        run: |
          set -euo pipefail
          activation_guard() { printf 'audit_activation_failed_guard=%s\n' "$1" >&2; exit 1; }
          [[ "$ALLOWED_CODE_PARENT" =~ ^[a-f0-9]{40}$ ]] || activation_guard parent-format
          [[ "$APPROVAL_SHA256" =~ ^[a-f0-9]{64}$ ]] || activation_guard receipt-format
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || activation_guard checkout-sha
          # Public read-only exact refs, fetch no full history and no authenticated remote writes.
          git fetch --no-tags --depth=1 origin "$ALLOWED_CODE_PARENT" 42da8f3ed18ca1c0f1462032db5dc05ce77362a1 4ed344a8bb859e841c35041f3f07b9510a930492 || activation_guard reviewed-refs-read
          git diff --quiet "$ALLOWED_CODE_PARENT" HEAD -- . ':(exclude).github/workflows/physical-audit-arm64.yml' || activation_guard direct-parent-source-bytes
          test "$(git cat-file -p HEAD | sed -n 's/^parent //p')" = "$ALLOWED_CODE_PARENT" || activation_guard direct-parent
          umask 077
          receipt=$(mktemp "$RUNNER_TEMP/noncommercial-audit-approval.XXXXXX") || activation_guard receipt-file
          printf '%s' "$APPROVAL_JSON" > "$receipt"
          test "$(shasum -a 256 "$receipt" | awk '{print $1}')" = "$APPROVAL_SHA256" || activation_guard receipt-sha
          unset APPROVAL_JSON
          bash probes/physical-audit/hosted/run_metadata.sh "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$receipt" "$APPROVAL_SHA256"
