name: Physical audit ARM64 build (metadata only; no delivery)
on:
  push:
    branches: [verification/physical-audit-arm64]
permissions:
  contents: read
concurrency:
  group: physical-audit-arm64-metadata-only
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'R347H4CK3R/VoiceMatrix-Development' && github.ref == 'refs/heads/verification/physical-audit-arm64' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require exact public source and externally approved hosted scope
        env:
          ALLOWED_CODE_PARENT: f04ef41de2dde27041f7664d85fb0338688b584e
          APPROVAL_SHA256: 88a939d267da192d7045ecc3303a59ca75c09adcf911871c32bf59f54c4e29e4
          APPROVAL_JSON: '{"approvalDateUTC":"2026-11-19","approvedBy":"Coordinating maintainer","baselineIPA":{"sha256":"04d199d356a5fde59101d3909a35abf05e8dd1129141e0add66e1e45006c5d11","size":1330407101},"graphSHA256":"ff9369012927524e241f0cf3bcca1a72177947e02ef7933beef716377c87de72","iphoneOSSDK":"26.5","modelLocks":{"Diarization":"137ad0aba1483d0ba3c74cb5380ab05f5cd76a5eb47aa69b9de41c353315e7e0","F5TTS":"e51680c87462bb26433613fe61f7da735c59ab770020f5705a6159cda78bdb70","ParakeetASR":"f58c59e24e41e17f701d7b2b7fc4aa45343c232a2119fb6540357f676a6416ce"},"noFurtherDistribution":true,"noPersonalRecordings":true,"runtimeRevision":"42da8f3ed18ca1c0f1462032db5dc05ce77362a1","schemaVersion":1,"scope":"private-noncommercial-hardware-audit-only","xcodeVersion":"Xcode 26.6","xcodegenSHA256":"a450f63bdd650c280cfce0fef6c94dbb19c5bf8dc32811361fd5d2e912718503"}'
        run: |
          set -euo pipefail
          [[ "$ALLOWED_CODE_PARENT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVAL_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Public read-only exact refs, fetch no full history and no authenticated remote writes.
          git fetch --no-tags --depth=1 origin "$ALLOWED_CODE_PARENT" 42da8f3ed18ca1c0f1462032db5dc05ce77362a1 4ed344a8bb859e841c35041f3f07b9510a930492
          git diff --quiet "$ALLOWED_CODE_PARENT" HEAD -- . ':(exclude).github/workflows/physical-audit-arm64.yml'
          test "$(git cat-file -p HEAD | sed -n 's/^parent //p')" = "$ALLOWED_CODE_PARENT"
          umask 077
          receipt=$(mktemp "$RUNNER_TEMP/noncommercial-audit-approval.XXXXXX")
          printf '%s' "$APPROVAL_JSON" > "$receipt"
          test "$(shasum -a 256 "$receipt" | awk '{print $1}')" = "$APPROVAL_SHA256"
          unset APPROVAL_JSON
          bash probes/physical-audit/hosted/run_metadata.sh "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$receipt" "$APPROVAL_SHA256"
