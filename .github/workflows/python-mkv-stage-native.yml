name: Embedded Python MKV stage native verification (no release)
on:
  push:
    branches: [verification/python-mkv-stage]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-mkv-stage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-integration:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare verified tooling and source-only resources
        run: |
          mkdir -p .tooling
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o .tooling/xcodegen.zip
          echo 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  .tooling/xcodegen.zip' | shasum -a 256 -c -
          unzip -q .tooling/xcodegen.zip -d .tooling
          python3 tools/check_conversion_inputs.py
          python3 tools/create_diagnostic_collection.py
          mkdir -p VoiceMatrix/Resources/Phonon VoiceMatrix/Resources/OpenVoice VoiceMatrix/Resources/F5TTS VoiceMatrix/Resources/Separation
          .tooling/xcodegen/bin/xcodegen generate
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.python-runtime/app_packages python3 tools/python-runtime/run_resolver_tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/python-packaging -v
      - name: Record exact source and run portable policy checks
        run: |
          git rev-parse HEAD | tee native-mkv-stage-source.txt
          python3 -m unittest tests.test_mkv_stage_policy tests.test_mkv_python_bridge_contract -v
      - name: Compile full production ARM64 app
        run: |
          set -o pipefail
          xcodebuild -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath native-device-build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build > native-device-compile.log 2>&1 || { tail -160 native-device-compile.log; exit 1; }
          python3 tools/python-runtime/verify_python_bundle.py native-device-build/Build/Products/Debug-iphoneos/VoiceMatrix.app --json-out native-runtime-inventory.json
      - name: Execute bundled CPython stage and resolver in the app on iOS26
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 tools/python-runtime/select_ios26_simulator.py)
          xcodebuild -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath native-simulator-build -resultBundlePath native-app-resolver.xcresult -only-testing:VoiceMatrixTests/MKVPythonRuntimeTests -only-testing:VoiceMatrixTests/OnDeviceMediaResolverTests -only-testing:VoiceMatrixTests/LocalMediaAcquisitionTests CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test > native-app-resolver.log 2>&1 || { tail -160 native-app-resolver.log; exit 1; }
          python3 tools/python-runtime/require_adapter_tests.py native-app-resolver.log
          python3 - <<'PY_GATE'
          import pathlib, re
          log = pathlib.Path("native-app-resolver.log").read_text()
          names = (
              "testBundledPolicyExecutesAllThreeDecisions",
              "testEmbeddedNULRejectsAndOversizeNeverReturnsDecision",
              "testCancellationSuppressesDecisionWithoutAffectingNextRequest",
              "testOriginalResolverStillExecutesBundledAuthorizationDecision",
          )
          for name in names:
              if not re.search(r"Test Case .*MKVPythonRuntimeTests[ .]" + name + r"(?:\(\))?[\]']* passed", log):
                  raise SystemExit("Required bundled bridge test missing: " + name)
          PY_GATE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-mkv-stage-native-verification
          path: |
            native-mkv-stage-source.txt
            native-device-compile.log
            native-app-resolver.log
            native-app-resolver.xcresult
            native-runtime-inventory.json
          retention-days: 7
          if-no-files-found: warn
