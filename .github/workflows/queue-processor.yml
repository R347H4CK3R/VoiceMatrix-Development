name: Prepared voice queue processor checks
on:
  push:
    branches-ignore: [codex/iphone-build4, codex/iphone-build5, codex/rvc-conversion-controls]
    paths: ['tools/test_shell.py', 'tests/test_test_shell.py', 'tools/run_platform_regressions.py', 'tests/platform-regression-coverage.json', 'tests/test_platform_regressions.py', 'tests/test_character_workflow_budget.py', 'tests/test_native_acquisition.py', 'tests/test_selective_voice_wiring.py', 'tests/test_circleci_native_candidate.py', 'ci/circleci/native-ui.candidate.yml', '.circleci/config.yml', '.github/workflows/voicematrix-049-candidate.yml', 'tools/listening_review.py', 'tools/listening_review.html', 'tests/test_listening_review.py', 'tools/source_inspection.py', 'tests/test_source_inspection.py', 'tools/source_review.py', 'tools/source_review.html', 'tests/test_source_review.py', 'tests/source_review_browser.cjs', 'tests/source_review_browser_server.py', 'tools/private_voices.py', 'tests/test_private_voice_transfer.py', 'tools/queue_transport.py', 'tools/laptop_supervisor.py', 'tests/test_queue_dashboard.py', 'tools/companion_runtime.py', 'tests/test_companion_runtime.py', 'tools/video_prepare.py', 'tools/video_reference.py', 'tools/video_download.py', 'tools/process_control.py', 'tools/voice_pack.py', 'tests/test_video_preparation.py', 'tools/queue_processor.py', 'tools/video_queue.py', 'tools/master_voices.py', 'tools/pack_speech.py', 'tests/test_queue_processor.py', 'tests/test_queue_publication.py', 'tests/requirements-native.txt', '.github/workflows/queue-processor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Preserve pinned source bytes on Windows checkout
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Select Git Bash rather than the Windows WSL launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin'
          if (!(Test-Path (Join-Path $bash 'bash.exe'))) { throw 'Git Bash missing' }
          $bash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared regression dependencies
        run: python -m pip install -r tests/requirements-native.txt
      - name: Install Windows media test dependency
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install Linux media test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run source, real queue/files, transport and cancellation regressions
        run: python tools/run_platform_regressions.py --mode ${{ runner.os == 'Windows' && 'windows-worker' || 'full' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Platform-regression-${{ runner.os }}
          path: platform-regression-evidence.json
          if-no-files-found: error


  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test client
        run: |
          npm install --no-audit --no-fund --prefix browser-runtime playwright@1.62.1
          browser-runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Install media fixture dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check actual mobile-width review form and server submission
        env:
          NODE_PATH: ${{ github.workspace }}/browser-runtime/node_modules
        run: node tests/source_review_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Source-review-mobile
          path: "*-mobile.png"
          if-no-files-found: error
        if: always()

