name: Prepared voice queue processor checks
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
    - name: Preserve pinned source bytes on Windows checkout
      if: runner.os == 'Windows'
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v4
    - name: Select Git Bash rather than the Windows WSL launcher
      if: runner.os == 'Windows'
      shell: pwsh
      run: '$bash = Join-Path $env:ProgramFiles ''Git\bin''

        if (!(Test-Path (Join-Path $bash ''bash.exe''))) { throw ''Git Bash missing''
        }

        $bash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install declared regression dependencies
      run: python -m pip install -r tests/requirements-native.txt
    - name: Install Windows media test dependency
      if: runner.os == 'Windows'
      run: choco install ffmpeg -y --no-progress
    - name: Install Linux media test dependency
      if: runner.os == 'Linux'
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg

        '
    - name: Run source, real queue/files, transport and cancellation regressions
      run: python tools/run_platform_regressions.py --mode ${{ runner.os == 'Windows'
        && 'windows-worker' || 'full' }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Platform-regression-${{ runner.os }}
        path: platform-regression-evidence.json
        if-no-files-found: error
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned browser test client
      run: 'npm install --no-audit --no-fund --prefix browser-runtime playwright@1.62.1

        browser-runtime/node_modules/.bin/playwright install --with-deps chromium

        '
    - name: Install media fixture dependency
      run: sudo apt-get update && sudo apt-get install -y ffmpeg
    - name: Check actual mobile-width review form and server submission
      env:
        NODE_PATH: ${{ github.workspace }}/browser-runtime/node_modules
      run: node tests/source_review_browser.cjs
    - uses: actions/upload-artifact@v4
      with:
        name: Source-review-mobile
        path: '*-mobile.png'
        if-no-files-found: error
      if: always()
'on':
  push:
    branches:
    - preview/voicematrix-build12
  workflow_dispatch: null
