name: Laptop queue recovery checks
permissions:
  contents: read
jobs:
  queue:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Windows media test dependency
      if: runner.os == 'Windows'
      run: choco install ffmpeg -y --no-progress
    - name: Install Linux media test dependency
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ffmpeg
    - name: Exercise real SQLite workers and authenticated HTTP transport
      run: python -m unittest discover -s tests -p "test_*queue*.py" -v
'on':
  push:
    branches:
    - preview/voicematrix-build12
  workflow_dispatch: null
