name: Retained clip speaker review UI on real speech
'on':
  workflow_dispatch:
  push:
    branches: [feature/retained-clip-speaker-review, verification/clip-speaker-review-ui]
    paths:
      - 'VoiceMatrix/ClipSpeakerReview*.swift'
      - 'VoiceMatrix/LocalVideoStudioView.swift'
      - 'VoiceMatrix/SeparationClip*.swift'
      - 'VoiceMatrixUITests/ClipSpeakerReviewUITests.swift'
      - 'tools/seed_clip_speaker_review_ui.py'
      - 'tools/bundle_diarization.py'
      - 'tests/test_clip_speaker_review_ui_fixture.py'
      - 'probes/clip-speaker-review/prepare.py'
      - 'tests/fixtures/licensed-human-source/**'
      - '.github/workflows/retained-clip-speaker-review-ui.yml'
permissions:
  contents: read
concurrency:
  group: retained-clip-speaker-review-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned diarization resources and genuine open-licensed speech
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 tools/bundle_diarization.py
          python3 tools/check_conversion_inputs.py
          python3 tools/create_diagnostic_collection.py
          mkdir -p VoiceMatrix/Resources/{Phonon,OpenVoice,F5TTS,Separation} speaker-review-evidence
          git rev-parse HEAD > speaker-review-evidence/source-commit.txt
          python3 probes/clip-speaker-review/prepare.py "$RUNNER_TEMP/clip-speaker-review-ui-fixtures"
          cp "$RUNNER_TEMP/clip-speaker-review-ui-fixtures/fixture.json" speaker-review-evidence/licensed-fixture.json
          xcodegen generate
      - name: Boot a fresh owned iOS 26 simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          runtimes=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))['runtimes']
          available=[r for r in runtimes if r.get('isAvailable') and 'iOS' in r['name'] and r['version'].startswith('26.')]
          assert available, 'iOS 26 simulator runtime required'
          runtime=max(available,key=lambda r:tuple(map(int,r['version'].split('.'))))['identifier']
          device=subprocess.check_output(['xcrun','simctl','create','VoiceMatrix-Clip-Review-UI','com.apple.CoreSimulator.SimDeviceType.iPhone-16-Plus',runtime],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write(f'CLIP_REVIEW_UI_SIMULATOR={device}\n')
          subprocess.run(['xcrun','simctl','boot',device],check=True,timeout=60)
          PY
      - name: Compile the actual app and targeted XCTest bundle
        run: |
          xcodebuild build-for-testing -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -destination "platform=iOS Simulator,id=$CLIP_REVIEW_UI_SIMULATOR" -derivedDataPath speaker-review-ui-build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:VoiceMatrixUITests/ClipSpeakerReviewUITests > speaker-review-evidence/build.log 2>&1 || { tail -160 speaker-review-evidence/build.log; exit 1; }
      - name: Install and seed only the owned app data container
        run: |
          python3 - <<'PY'
          import os,subprocess
          subprocess.run(['xcrun','simctl','bootstatus',os.environ['CLIP_REVIEW_UI_SIMULATOR'],'-b'],check=True,timeout=360)
          PY
          xcrun simctl install "$CLIP_REVIEW_UI_SIMULATOR" speaker-review-ui-build/Build/Products/Debug-iphonesimulator/VoiceMatrix.app
          CONTAINER=$(xcrun simctl get_app_container "$CLIP_REVIEW_UI_SIMULATOR" com.voicematrix.app data)
          FIXTURE="$RUNNER_TEMP/clip-speaker-review-ui-fixtures"
          python3 -m tools.seed_clip_speaker_review_ui seed "$CONTAINER" speaker-review-evidence/seed-baseline.json --simulator-id "$CLIP_REVIEW_UI_SIMULATOR" --fixture "$FIXTURE/single.wav" --manifest "$FIXTURE/fixture.json"
      - name: Exercise actual prepare, review, resume, label and reopen UI
        run: |
          set -o pipefail
          xcodebuild test-without-building -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -destination "platform=iOS Simulator,id=$CLIP_REVIEW_UI_SIMULATOR" -derivedDataPath speaker-review-ui-build -resultBundlePath speaker-review-evidence/review-ui.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 420 -only-testing:VoiceMatrixUITests/ClipSpeakerReviewUITests/testReviewRequiresFreshConsentAndKeepsClipSpecificAliasAcrossRelaunch > speaker-review-evidence/review-ui.log 2>&1 || { tail -180 speaker-review-evidence/review-ui.log; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('speaker-review-evidence/review-ui.log').read_text()
          assert re.search(r"Test Case .*testReviewRequiresFreshConsentAndKeepsClipSpecificAliasAcrossRelaunch.* passed",text)
          assert ('** TEST EXECUTE SUCCEEDED **' in text or '** TEST SUCCEEDED **' in text)
          assert not re.search(r"Test Case .* (?:failed|skipped)",text)
          PY
          CONTAINER=$(xcrun simctl get_app_container "$CLIP_REVIEW_UI_SIMULATOR" com.voicematrix.app data)
          python3 -m tools.seed_clip_speaker_review_ui check "$CONTAINER" speaker-review-evidence/seed-baseline.json --simulator-id "$CLIP_REVIEW_UI_SIMULATOR" | tee speaker-review-evidence/preservation.json
      - name: Export actual screen evidence
        if: always()
        run: if [ -d speaker-review-evidence/review-ui.xcresult ]; then xcrun xcresulttool export attachments --path speaker-review-evidence/review-ui.xcresult --output-path speaker-review-evidence/screenshots; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Retained-clip-speaker-review-UI-evidence
          path: speaker-review-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this workflow's simulator
        if: always()
        run: if [ -n "${CLIP_REVIEW_UI_SIMULATOR:-}" ]; then xcrun simctl shutdown "$CLIP_REVIEW_UI_SIMULATOR" || true; xcrun simctl delete "$CLIP_REVIEW_UI_SIMULATOR"; fi
