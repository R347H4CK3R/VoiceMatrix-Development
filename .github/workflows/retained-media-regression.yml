name: Retained media filesystem regression
'on':
  push:
    branches: [fix/standalone-recovery-review, integration/standalone-reviewed-fixes]
    paths:
      - .github/workflows/retained-media-regression.yml
      - VoiceMatrix/RetainedMediaReader.swift
      - tests/native/RetainedMediaReaderChecks.swift
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retained-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  filesystem:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute exact production reader filesystem regressions
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          xcrun swiftc --version > evidence/compiler.txt
          xcrun swiftc -parse-as-library VoiceMatrix/RetainedMediaReader.swift tests/native/RetainedMediaReaderChecks.swift -o /tmp/retained-media-checks 2>&1 | tee evidence/compile.log
          /tmp/retained-media-checks 2>&1 | tee evidence/checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Retained-media-Darwin-filesystem-evidence
          path: evidence
          retention-days: 14
