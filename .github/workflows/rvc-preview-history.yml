name: Durable RVC diagnostic history
on:
  workflow_dispatch:
  push:
    branches: [feature/durable-rvc-history]
    paths:
      - 'VoiceMatrix/RVC*.swift'
      - 'VoiceMatrix/RetainedMediaReader.swift'
      - 'tests/test_rvc_preview_history.py'
      - 'probes/rvc-result-history/**'
      - '.github/workflows/rvc-preview-history.yml'
permissions:
  contents: read
jobs:
  native-history:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native filesystem integrity and cancellation tests
        run: python3 -m unittest tests.test_rvc_preview_history -v
