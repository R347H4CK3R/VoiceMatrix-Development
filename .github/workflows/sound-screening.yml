# Verify bounded empty-lexical ASR recovery and unchanged screening safeguards.
# Verify retained generated output and diagnose raw recognition rejection.
name: Real sound screening calibration
'on':
  push:
    branches: [codex/rvc-conversion-controls]
    paths: [.github/workflows/sound-screening.yml, 'probes/sound-screening/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screening:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Human-local-pipeline-evidence
          run-id: 43681000037
          github-token: ${{ github.token }}
          path: baseline
      - name: Prepare labeled speech and unsuitable controls
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 probes/sound-screening/prepare.py baseline screening-evidence
      - name: Compare classifier windows without changing thresholds
        run: python3 probes/sound-screening/run.py screening-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sound-screening-calibration
          path: screening-evidence
          retention-days: 14
