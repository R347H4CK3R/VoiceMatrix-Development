name: Synthetic saved-speaker actual UI handoff
'on':
  push:
    branches: [feature/voicematrix-speaker-handoff]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speaker-handoff-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare source-only resources and a fresh owned simulator
        run: |
          python3 tools/check_conversion_inputs.py
          python3 tools/create_diagnostic_collection.py
          mkdir -p VoiceMatrix/Resources/Phonon VoiceMatrix/Resources/OpenVoice VoiceMatrix/Resources/F5TTS
          brew install xcodegen
          xcodegen generate
          python3 - <<'PY'
          import json,subprocess,os
          available=[x for x in json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))['runtimes'] if x.get('isAvailable') and 'iOS' in x['name'] and str(x.get('version','')).startswith('26.')]
          assert available,'iOS26 simulator required'
          runtime=sorted(available,key=lambda x:tuple(map(int,x['version'].split('.'))))[-1]['identifier']
          device=subprocess.check_output(['xcrun','simctl','create','VoiceMatrix-Synthetic-Handoff','com.apple.CoreSimulator.SimDeviceType.iPhone-16-Plus',runtime],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('HANDOFF_SIMULATOR_ID='+device+'\n')
          subprocess.run(['xcrun','simctl','boot',device],check=True,timeout=60)
          subprocess.run(['xcrun','simctl','bootstatus',device,'-b'],check=True,timeout=360)
          PY
      - name: Compile actual app and handoff XCUI test
        run: |
          xcodebuild build-for-testing -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -destination "platform=iOS Simulator,id=$HANDOFF_SIMULATOR_ID" -derivedDataPath handoff-build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:VoiceMatrixUITests/SpeakerHandoffUITests > handoff-build.log 2>&1 || { tail -120 handoff-build.log; exit 1; }
      - name: Import synthetic profiles with production store and seed only new simulator data
        run: |
          swiftc -parse-as-library VoiceMatrix/CharacterFolderStore.swift tests/native/SpeakerHandoffUIFixture.swift -o handoff-fixture-generator
          ./handoff-fixture-generator "$RUNNER_TEMP/handoff-synthetic-fixture"
          xcrun simctl install "$HANDOFF_SIMULATOR_ID" handoff-build/Build/Products/Debug-iphonesimulator/VoiceMatrix.app
          CONTAINER=$(xcrun simctl get_app_container "$HANDOFF_SIMULATOR_ID" com.voicematrix.app data)
          python3 tools/speaker_handoff_fixture.py "$CONTAINER" "$RUNNER_TEMP/handoff-synthetic-fixture" handoff-fixture-receipt.json --simulator-id "$HANDOFF_SIMULATOR_ID"
      - name: Tap both real handoff buttons and verify preserved data
        run: |
          set -o pipefail
          xcodebuild test-without-building -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -destination "platform=iOS Simulator,id=$HANDOFF_SIMULATOR_ID" -derivedDataPath handoff-build -resultBundlePath handoff-ui.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 -only-testing:VoiceMatrixUITests/SpeakerHandoffUITests/testExplicitSavedSpeakerSpeechAndConversionRoutes > handoff-ui.log 2>&1 || { tail -160 handoff-ui.log; exit 1; }
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('handoff-ui.log').read_text()
          assert re.search(r"Test Case .*testExplicitSavedSpeakerSpeechAndConversionRoutes.* passed",text)
          assert '** TEST EXECUTE SUCCEEDED **' in text and not re.search(r'Test Case .* (?:failed|skipped)',text)
          PY
          CONTAINER=$(xcrun simctl get_app_container "$HANDOFF_SIMULATOR_ID" com.voicematrix.app data)
          python3 tools/speaker_handoff_fixture.py "$CONTAINER" "$RUNNER_TEMP/handoff-synthetic-fixture" handoff-fixture-receipt.json --simulator-id "$HANDOFF_SIMULATOR_ID" --verify | tee handoff-preservation.log
      - name: Export actual navigation screenshots
        if: always()
        run: if [ -d handoff-ui.xcresult ]; then xcrun xcresulttool export attachments --path handoff-ui.xcresult --output-path handoff-screenshots; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Synthetic-speaker-handoff-UI-evidence
          if-no-files-found: error
          path: |
            handoff-build.log
            handoff-ui.log
            handoff-ui.xcresult
            handoff-fixture-receipt.json
            handoff-preservation.log
            handoff-screenshots
      - name: Remove only this workflow's new simulator
        if: always()
        run: if [ -n "${HANDOFF_SIMULATOR_ID:-}" ]; then xcrun simctl shutdown "$HANDOFF_SIMULATOR_ID" || true; xcrun simctl delete "$HANDOFF_SIMULATOR_ID"; fi
