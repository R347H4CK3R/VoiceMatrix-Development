name: Standalone genuine MKV export media checks
'on':
  push:
    branches: [fix/standalone-mkv-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-media:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install independent media decoder
      run: command -v ffmpeg >/dev/null || brew install ffmpeg
    - name: Require native production export and independent decoded parity
      run: |
        set -euo pipefail
        test "$(uname)" = Darwin
        command -v swiftc
        command -v ffmpeg
        command -v ffprobe
        python3 -m unittest tests.test_mp4_sample_table tests.test_mkv_export tests.test_mkv_sample_tables -v 2>&1 | tee mkv-native-results.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Standalone-MKV-native-results
        path: mkv-native-results.log
        if-no-files-found: error
