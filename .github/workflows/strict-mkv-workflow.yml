name: Strict MKV real-media coordinator verification (no release)
on:
  push:
    branches: [verification/strict-mkv-workflow]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strict-mkv-workflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-integration:
    if: github.repository == 'R347H4CK3R/VoiceMatrix-Development' && github.ref == 'refs/heads/verification/strict-mkv-workflow'
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare verified tooling and source-only resources
        run: |
          mkdir -p .tooling
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o .tooling/xcodegen.zip
          echo 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  .tooling/xcodegen.zip' | shasum -a 256 -c -
          unzip -q .tooling/xcodegen.zip -d .tooling
          python3 tools/check_conversion_inputs.py
          python3 tools/create_diagnostic_collection.py
          mkdir -p VoiceMatrix/Resources/Phonon VoiceMatrix/Resources/OpenVoice VoiceMatrix/Resources/F5TTS VoiceMatrix/Resources/Separation
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 probes/mkv-workflow/generate.py .strict-mkv-fixture
          python3 - <<'PY_RESOURCE'
          from pathlib import Path
          p = Path("project.yml")
          source = p.read_text()
          anchor = ("\n  VoiceMatrixTests:\n    type: bundle.unit-test\n"
                    "    platform: iOS\n    sources:\n    - VoiceMatrixTests\n")
          assert source.count(anchor) == 1
          entries = "".join(f"    - path: .strict-mkv-fixture/{name}\n      buildPhase: resources\n" for name in
                            ("strict-mkv-licensed.mp4", "strict-mkv-fixture.json"))
          p.write_text(source.replace(anchor, anchor + entries))
          PY_RESOURCE
          .tooling/xcodegen/bin/xcodegen generate
          git restore -- project.yml
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.python-runtime/app_packages python3 tools/python-runtime/run_resolver_tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/python-packaging -v
      - name: Record exact source and run portable policy checks
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee native-mkv-stage-source.txt
          test "$(cat native-mkv-stage-source.txt)" = "$GITHUB_SHA"
          git rev-parse HEAD^{tree} | tee native-mkv-stage-tree.txt
          command -v swiftc
          python3 -m pip install PyYAML==6.0.3
          python3 -m unittest tests.test_mkv_stage_policy tests.test_mkv_python_bridge_contract tests.test_local_matroska_workflow_contract tests.test_strict_mkv_product_route tests.test_strict_mkv_lineage tests.test_separated_vocals_reference tests.test_local_snapshot_recovery -v
      - name: Compile full production ARM64 app
        run: |
          set -o pipefail
          xcodebuild -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath native-device-build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build > native-device-compile.log 2>&1 || { tail -160 native-device-compile.log; exit 1; }
          python3 tools/python-runtime/verify_python_bundle.py native-device-build/Build/Products/Debug-iphoneos/VoiceMatrix.app --json-out native-runtime-inventory.json
      - name: Run actual Python, MKV remux, derivation and clip extraction
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 tools/python-runtime/select_ios26_simulator.py)
          xcodebuild -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath native-simulator-build -resultBundlePath native-strict-workflow.xcresult -only-testing:VoiceMatrixTests/LocalMatroskaWorkflowTests -only-testing:VoiceMatrixTests/LocalMatroskaWorkflowMediaTests -only-testing:VoiceMatrixTests/StrictMatroskaJobTests -only-testing:VoiceMatrixTests/StrictMatroskaLineageTests CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO test > native-strict-workflow.log 2>&1 || { tail -180 native-strict-workflow.log; exit 1; }
          python3 - <<'PY_GATE'
          from pathlib import Path
          import re
          log = Path("native-strict-workflow.log").read_text()
          assert "** TEST SUCCEEDED **" in log and not re.search(r"Test Case .* (?:skipped|failed)", log)
          mandatory = {
              "LocalMatroskaWorkflowTests": {"testPublishedValidationPermitsOriginalAbsentAndRejectsOrphanSwap"},
              "LocalMatroskaWorkflowMediaTests": {"testBundledPythonResumesVerifiedMKVWithoutOriginalAndExtractsExactClip",
                                                  "testCorruptCommittedMKVRejectsDespiteIntactOriginal"},
              "StrictMatroskaJobTests": {"testLegacyAndFileJobsRoundTripWithoutOptIn",
                                         "testStrictJobAcceptsOnlyCompleteDerivedSourceBinding",
                                         "testStrictRejectsInvalidSchemaAndCachesWithoutDerivedSource"},
              "StrictMatroskaLineageTests": {"testClipReceiptBindsLineageAndExactSampleIntervalWhileLegacyDecodes",
                                              "testReferenceProvenanceRoundTripAndInvalidTimeOrHashRejected",
                                              "testSeparatedVocalsReceiptAndReferenceKeepClipHashAndAbsoluteTime"},
          }
          for file, required in mandatory.items():
              names = re.findall(r"func (test\w+)\(", Path(f"VoiceMatrixTests/{file}.swift").read_text())
              assert required <= set(names), (file, required - set(names))
              for name in names:
                  assert re.search(r"Test Case .*" + file + r"[ .]" + name + r"(?:\(\))?[\]']* passed", log), name
          PY_GATE
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" com.voicematrix.app data)
          cp -R "$CONTAINER/Documents/strict-mkv-native-evidence" strict-mkv-native-evidence
          python3 probes/mkv-workflow/verify.py strict-mkv-native-evidence .strict-mkv-fixture/strict-mkv-fixture.json | tee strict-mkv-oracle.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strict-mkv-workflow-native-verification
          path: |
            native-mkv-stage-source.txt
            native-mkv-stage-tree.txt
            native-device-compile.log
            native-strict-workflow.log
            native-strict-workflow.xcresult
            .strict-mkv-fixture/strict-mkv-fixture.json
            strict-mkv-native-evidence/
            strict-mkv-oracle.json
            native-runtime-inventory.json
          retention-days: 7
          if-no-files-found: warn
