name: Targeted suggestion input diagnostic
on:
  push:
    branches: ['fix/local-audio-format-import']
    paths: ['.github/workflows/suggestion-input-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instrument synthetic test input without modifying app code
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('VoiceMatrixUITests/SpeechFeatureUITests.swift');s=p.read_text()
          old='        details.typeText("Synthetic test draft, never submitted.")\n        XCTAssertEqual(details.value as? String, "Synthetic test draft, never submitted.")'
          new='        let before = XCTAttachment(string: "Before typing: \\(String(describing: details.value))\\n\\(app.debugDescription)")\n        before.lifetime = .keepAlways; add(before)\n        details.typeText("Synthetic test draft, never submitted.")\n        let immediatelyTyped = details.value as? String\n        let after = XCTAttachment(string: "Immediately typed: \\(String(describing: immediatelyTyped))\\n\\(app.debugDescription)")\n        after.lifetime = .keepAlways; add(after)\n        let keyboardState = XCTAttachment(screenshot: app.screenshot()); keyboardState.lifetime = .keepAlways; add(keyboardState)\n        XCTAssertEqual(immediatelyTyped, "Synthetic test draft, never submitted.")'
          assert old in s
          p.write_text(s.replace(old,new))
          PYTHON
      - name: Prepare UI and bundled speaker-model resources, not a complete speech build
        run: |
          python3 tools/bundle_diarization.py
          python3 tools/check_conversion_inputs.py
          python3 tools/create_diagnostic_collection.py
          mkdir -p VoiceMatrix/Resources/Phonon VoiceMatrix/Resources/OpenVoice VoiceMatrix/Resources/F5TTS
          # These are UI availability fixtures, not valid engines or speech assets.
          # No config, weights, stock profiles or private references enter the app.
          printf '{"testOnlyUIAvailability":true}\n' > VoiceMatrix/Resources/F5TTS/voicematrix-engine.json
          printf '{"testOnlyUIAvailability":true}\n' > VoiceMatrix/Resources/OpenVoice/model-manifest.json
          cp -R tests/fixtures/DiagnosticVoices VoiceMatrix/Resources/F5TTS/UITestVoices
          # XCTest waits for UI idleness after taps; a 2.5-second clip can finish
          # before it can inspect Stop. Extend only this UI fixture, not audio gates.
          python3 - <<'PY'
          import hashlib,json,pathlib,wave
          root=pathlib.Path('VoiceMatrix/Resources/F5TTS/UITestVoices/diagnostic-neutral')
          audio=root/'reference.wav'
          with wave.open(str(audio),'rb') as f:
              params=f.getparams()
              pcm=f.readframes(f.getnframes())*6
          with wave.open(str(audio),'wb') as f:
              f.setparams(params)
              f.writeframes(pcm)
          manifest=json.loads((root/'manifest.json').read_text())
          manifest.update(referenceSHA256=hashlib.sha256(audio.read_bytes()).hexdigest(),
                          referenceBytes=audio.stat().st_size,seconds=len(pcm)/48000,
                          referenceText=' '.join([manifest['referenceText']]*6))
          (root/'manifest.json').write_text(json.dumps(manifest))
          assert 14 < manifest['seconds'] < 15
          PY
          brew install xcodegen
          xcodegen generate
          python3 - <<'PYCODE'
          import json,subprocess,os
          runtimes=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))['runtimes']
          available=[x for x in runtimes if x.get('isAvailable') and 'iOS' in x['name'] and str(x.get('version','')).startswith('26.')]
          assert available,'No iOS 26 simulator runtime available'
          runtime=sorted(available,key=lambda x:tuple(int(p) for p in x['version'].split('.')))[-1]['identifier']
          device=subprocess.check_output(['xcrun','simctl','create','VoiceMatrix-Sync-UI','com.apple.CoreSimulator.SimDeviceType.iPhone-16-Plus',runtime],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIMULATOR_ID='+device+'\n')
          subprocess.run(['xcrun','simctl','boot',device],check=True,timeout=60)
          PYCODE
      - name: Build UI tests while the owned simulator starts
        run: |
          xcodebuild build-for-testing -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:VoiceMatrixUITests/SpeechFeatureUITests/testSuggestionRequiresPublicAcknowledgementAndRetainsDraft -derivedDataPath ui-build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO > character-ui-build.log 2>&1 || { tail -160 character-ui-build.log; exit 1; }
      - name: Wait for the simulator launch services to finish booting
        run: |
          python3 - <<'PYCODE'
          import os,subprocess
          subprocess.run(['xcrun','simctl','bootstatus',os.environ['SIMULATOR_ID'],'-b'],check=True,timeout=360)
          PYCODE
      - name: Capture exact suggestion input before retention
        run: |
          xcodebuild test-without-building -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:VoiceMatrixUITests/SpeechFeatureUITests/testSuggestionRequiresPublicAcknowledgementAndRetainsDraft -derivedDataPath ui-build -resultBundlePath character-ui.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO > character-ui.log 2>&1 || { tail -160 character-ui.log; exit 1; }
      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: |
          if [ -d character-ui.xcresult ]; then xcrun xcresulttool export attachments --path character-ui.xcresult --output-path ui-screenshots; fi
          if [ -d character-workflow.xcresult ]; then xcrun xcresulttool export attachments --path character-workflow.xcresult --output-path workflow-screenshots; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Suggestion-input-diagnostic-evidence
          path: |
            character-workflow.log
            character-workflow.xcresult
            workflow-screenshots
            character-ui.log
            character-ui-build.log
            ui-simulator.json
            character-ui.xcresult
            ui-screenshots
          retention-days: 14

      - name: Remove only this job simulator
        if: always()
        run: if [ -n "${SIMULATOR_ID:-}" ]; then xcrun simctl shutdown "$SIMULATOR_ID" || true; xcrun simctl delete "$SIMULATOR_ID"; fi
