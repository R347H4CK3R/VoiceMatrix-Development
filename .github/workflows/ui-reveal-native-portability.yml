name: Native UI geometry and generator parity checks
'on':
  push:
    branches:
    - fix/ui-reveal-native-portability
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: 'python3 -m pip install PyYAML==6.0.3

        python3 -m unittest tests.test_ui_reveal_policy tests.test_circleci_native_candidate -v'
